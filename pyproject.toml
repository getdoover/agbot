[project]
name = "agbot"
version = "0.1.0"
description = "Populates a UI in the Doover WebApp by connecting to the AgBot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=0.4.18",
    "aiohttp>=3.11.18",
]

[project.scripts]
export-config = "agbot.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]

[tool.uv.sources]
pydoover = { git = "https://github.com/getdoover/pydoover", rev = "doover-2" }
